<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">
<title>自适应图片浏览器</title>
<style>
/* 基础样式 */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    color: #333;
    padding: clamp(10px, 3vw, 30px);
}

/* 标题 */
h1 {
    text-align: center;
    font-size: clamp(20px, 3vw, 30px);
    margin: 10px 0 25px;
}

/* 单列图片，自适应宽度 */
.gallery {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
}

.gallery img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 20px;
    border-radius: clamp(4px, 1vw, 10px);
    cursor: pointer;
    object-fit: contain;
    transition: opacity 0.2s;
}

.gallery img:hover {
    opacity: 0.85;
}

/* 图片浏览层 */
.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.96);
    align-items: center;
    justify-content: center;
    padding: 60px 15px;
}

.viewer.active {
    display: flex;
}

/* 大图 */
.viewer-image {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
}

/* 关闭按钮 */
.close {
    position: absolute;
    top: 10px;
    right: clamp(15px, 3vw, 35px);
    color: white;
    font-size: clamp(30px, 5vw, 45px);
    line-height: 1;
    cursor: pointer;
    z-index: 2;
    padding: 5px 10px;
}

/* 左右切换 */
.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: clamp(30px, 5vw, 50px);
    padding: clamp(8px, 2vw, 20px);
    cursor: pointer;
    user-select: none;
    z-index: 2;
    border-radius: 8px;
}

.nav:active {
    background: rgba(255, 255, 255, 0.2);
}

.prev {
    left: 0;
}

.next {
    right: 0;
}

/* 图片计数 */
.counter {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 14px;
}

/* 手机端优化 */
@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    h1 {
        margin: 10px 0 18px;
    }

    .gallery img {
        margin-bottom: 12px;
        border-radius: 5px;
    }

    .viewer {
        padding: 55px 5px;
    }

    .viewer-image {
        max-width: 100%;
        max-height: 100%;
    }

    .nav {
        padding: 12px 8px;
        font-size: 32px;
    }

    .close {
        top: 15px;
        right: 10px;
    }
}

/* 超小屏幕 */
@media (max-width: 360px) {
    .nav {
        font-size: 26px;
    }
}
</style>
</head>

<!-- 独立大图浏览 -->
<div class="viewer" id="viewer">

    <span class="close" id="close"
          aria-label="关闭">&times;</span>

    <span class="nav prev" id="prev"
          aria-label="上一张">&#10094;</span>

    <img class="viewer-image" id="viewerImage"
         src="" alt="大图预览">

    <span class="nav next" id="next"
          aria-label="下一张">&#10095;</span>

    <div class="counter" id="counter"></div>
</div>

<script>
const images = Array.from(
    document.querySelectorAll("#gallery img")
);

const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const counter = document.getElementById("counter");

let currentIndex = 0;

// 打开图片
function openViewer(index) {
    currentIndex = index;
    updateImage();
    viewer.classList.add("active");
    document.body.style.overflow = "hidden";
}

// 更新大图
function updateImage() {
    const img = images[currentIndex];

    viewerImage.src = img.src;
    viewerImage.alt = img.alt || "图片预览";
    counter.textContent =
        `${currentIndex + 1} / ${images.length}`;
}

// 关闭图片
function closeViewer() {
    viewer.classList.remove("active");
    document.body.style.overflow = "";
}

// 上一张
function showPrev() {
    currentIndex =
        (currentIndex - 1 + images.length) % images.length;
    updateImage();
}

// 下一张
function showNext() {
    currentIndex =
        (currentIndex + 1) % images.length;
    updateImage();
}

// 绑定图片点击
images.forEach((img, index) => {
    img.addEventListener("click", () => {
        openViewer(index);
    });
});

// 绑定按钮
document.getElementById("close")
    .addEventListener("click", closeViewer);

document.getElementById("prev")
    .addEventListener("click", showPrev);

document.getElementById("next")
    .addEventListener("click", showNext);

// 点击黑色背景关闭
viewer.addEventListener("click", (event) => {
    if (event.target === viewer) {
        closeViewer();
    }
});

// 键盘操作
document.addEventListener("keydown", (event) => {
    if (!viewer.classList.contains("active")) return;

    if (event.key === "Escape") closeViewer();
    if (event.key === "ArrowLeft") showPrev();
    if (event.key === "ArrowRight") showNext();
});
</script>

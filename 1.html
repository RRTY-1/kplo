
<!DOCTYPE html>

<title>图片浏览器</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f5f5f5;
    padding: 20px;
}

h1 {
    text-align: center;
    margin: 20px 0;
}

/* 图片纵向排列，不使用网格 */
.gallery {
    max-width: 800px;
    margin: 0 auto;
}

.gallery img {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
}

.gallery img:hover {
    opacity: 0.85;
}

/* 独立图片浏览层 */
.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.95);
    align-items: center;
    justify-content: center;
}

.viewer.active {
    display: flex;
}

.viewer-image {
    max-width: 90vw;
    max-height: 90vh;
    object-fit: contain;
    user-select: none;
}

/* 关闭按钮 */
.close {
    position: absolute;
    top: 15px;
    right: 25px;
    color: white;
    font-size: 40px;
    cursor: pointer;
    z-index: 2;
}

/* 左右按钮 */
.nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 45px;
    padding: 20px;
    cursor: pointer;
    user-select: none;
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

.counter {
    position: absolute;
    bottom: 20px;
    color: white;
    font-size: 16px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .gallery img {
        margin-bottom: 12px;
    }

    .viewer-image {
        max-width: 95vw;
        max-height: 85vh;
    }

    .nav {
        font-size: 30px;
        padding: 10px;
    }
}
</style>
</head>

<!-- 独立浏览器 -->
<div class="viewer" id="viewer">
    <span class="close" id="close">&times;</span>
    <span class="nav prev" id="prev">&#10094;</span>

    <img class="viewer-image" id="viewerImage" src="" alt="大图">

    <span class="nav next" id="next">&#10095;</span>
    <div class="counter" id="counter"></div>
</div>

<script>
const images = document.querySelectorAll("#gallery img");
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");
const counter = document.getElementById("counter");

let currentIndex = 0;

// 打开图片
function openViewer(index) {
    currentIndex = index;
    updateImage();
    viewer.classList.add("active");
    document.body.style.overflow = "hidden";
}

// 更新图片
function updateImage() {
    viewerImage.src = images[currentIndex].src;
    viewerImage.alt = images[currentIndex].alt;

    counter.textContent =
        `${currentIndex + 1} / ${images.length}`;
}

// 关闭图片
function closeViewer() {
    viewer.classList.remove("active");
    document.body.style.overflow = "";
}

// 上一张
function showPrev() {
    currentIndex =
        (currentIndex - 1 + images.length) % images.length;
    updateImage();
}

// 下一张
function showNext() {
    currentIndex =
        (currentIndex + 1) % images.length;
    updateImage();
}

// 点击图片
images.forEach((img, index) => {
    img.addEventListener("click", () => openViewer(index));
});

// 关闭
document.getElementById("close")
    .addEventListener("click", closeViewer);

// 切换
document.getElementById("prev")
    .addEventListener("click", showPrev);

document.getElementById("next")
    .addEventListener("click", showNext);

// 点击背景关闭
viewer.addEventListener("click", (e) => {
    if (e.target === viewer) {
        closeViewer();
    }
});

// 键盘操作
document.addEventListener("keydown", (e) => {
    if (!viewer.classList.contains("active")) return;

    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowLeft") showPrev();
    if (e.key === "ArrowRight") showNext();
});
</script>
